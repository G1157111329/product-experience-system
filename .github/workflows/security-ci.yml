name: Security CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm ts-check

      - name: Lint
        run: pnpm lint

      - name: Audit high severity dependencies
        run: pnpm audit --audit-level high
        env:
          npm_config_registry: https://registry.npmjs.org/

      - name: Build
        run: pnpm build
        env:
          AUTH_SESSION_SECRET: ci-session-secret-not-for-production
          AI_CONFIG_ENCRYPTION_KEY: ci-ai-config-secret-not-for-production
