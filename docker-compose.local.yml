services:
  postgres:
    image: postgres:16-alpine
    container_name: product-experience-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: xp_experience
      POSTGRES_USER: xp_user
      POSTGRES_PASSWORD: xp_password_local_only
    ports:
      - "5433:5432"
    volumes:
      - product_experience_pgdata:/var/lib/postgresql/data
      - ./database-schema.sql:/docker-entrypoint-initdb.d/001-database-schema.sql:ro
      - ./scripts/verify-security-schema.sql:/docker-entrypoint-initdb.d/002-verify-security-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xp_user -d xp_experience"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-experience-app-local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 5000
      DATABASE_ACCESS_MODE: self-hosted-postgres
      DATABASE_URL: postgresql://xp_user:xp_password_local_only@postgres:5432/xp_experience
      SECURITY_SCHEMA_VERIFIED: "true"
      AUTH_SESSION_SECRET: local-docker-session-secret-change-me-2026
      AUTH_COOKIE_SECURE: "false"
      AI_CONFIG_ENCRYPTION_KEY: local-docker-ai-config-key-change-me-2026
      STORAGE_DRIVER: local
      LOCAL_UPLOAD_DIR: /app/public/uploads
      LOCAL_PUBLIC_BASE_PATH: /uploads
      LOCAL_UPLOAD_PUBLIC_ACCESS: public
      PUBLIC_MEDIA_BASE_URL: http://localhost:5000
      INITIAL_ADMIN_ACCOUNT: ${LOCAL_DOCKER_ADMIN_ACCOUNT:-dockeradmin}
      INITIAL_ADMIN_PASSWORD: ${LOCAL_DOCKER_ADMIN_PASSWORD:-DockerLocal2026}
      DEPLOYMENT_NETWORK: intranet
      AI_ALLOW_PRIVATE_ENDPOINTS: "true"
    ports:
      - "5000:5000"
    volumes:
      - product_experience_uploads:/app/public/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  product_experience_pgdata:
  product_experience_uploads:
